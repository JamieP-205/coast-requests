{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="sign-in">
  <form class="card" method="post">
    <h1>Song requests</h1>
    <p class="intro">Sign in to see the requests from the Coast website.</p>
    {% for message in get_flashed_messages() %}
      <p class="problem" role="alert">{{ message }}</p>
    {% endfor %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="big-button">Sign in</button>
  </form>
</main>
{% endblock %}
